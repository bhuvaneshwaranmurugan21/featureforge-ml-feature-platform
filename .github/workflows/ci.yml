name: CI

on:
  push:
    branches: [main, part3-stage6-aws-plan-qualification]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reviewed action digests from draft PR #1; Stage 0 adopts these CI-only pins.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # setup-java v6.0.1, immutable release commit verified on 2026-09-25.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
      - run: PIP_CONSTRAINT="$GITHUB_WORKSPACE/requirements-dev.lock" python -m pip install -e '.[dev,spark]'
      - run: PIP_CONSTRAINT="$GITHUB_WORKSPACE/requirements-dev.lock" python -m pip install -e '.[aws]'
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python tools/validate_stage0.py
      - run: python tools/validate_stage1.py
      - run: python tools/validate_stage2.py
      - run: python tools/validate_stage3.py
      - run: python tools/validate_stage4.py
      - run: python tools/validate_stage5.py
      - run: python tools/validate_stage6.py
      - name: Regenerate current deterministic simulation evidence
        run: |
          python -m featureforge.cli simulate --output /tmp/featureforge-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          generated = Path('/tmp/featureforge-evidence.json').read_bytes()
          committed = Path('evidence/stage1/local-simulation.json').read_bytes()
          evidence = json.loads(generated)
          assert evidence['result'] == 'PASS'
          assert evidence['production_claim'] is False
          assert generated == committed, 'simulation differs from committed evidence'
          PY
      - name: Regenerate deterministic Stage 1 temporal proof
        run: |
          python -m tools.run_stage1_proof --output /tmp/featureforge-stage1-proof.json
          cmp /tmp/featureforge-stage1-proof.json evidence/stage1/temporal-proof.json
      - name: Regenerate deterministic Stage 2 lifecycle proofs
        run: |
          python -m tools.run_stage2_proof --output-dir /tmp/featureforge-stage2-proof
          cmp /tmp/featureforge-stage2-proof/vertical-slice-proof.json evidence/stage2/vertical-slice-proof.json
          cmp /tmp/featureforge-stage2-proof/failure-recovery-proof.json evidence/stage2/failure-recovery-proof.json
      - name: Regenerate deterministic Stage 3 Spark proofs
        run: |
          python -m tools.run_stage3_proof --output-dir /tmp/featureforge-stage3-proof
          cmp /tmp/featureforge-stage3-proof/spark-proof.json evidence/stage3/spark-proof.json
          cmp /tmp/featureforge-stage3-proof/failure-recovery-proof.json evidence/stage3/failure-recovery-proof.json
      - name: Regenerate deterministic Stage 4 online proofs
        run: |
          python -m tools.run_stage4_proof --output-dir /tmp/featureforge-stage4-proof
          cmp /tmp/featureforge-stage4-proof/online-proof.json evidence/stage4/online-proof.json
          cmp /tmp/featureforge-stage4-proof/failure-recovery-proof.json evidence/stage4/failure-recovery-proof.json
      - name: Regenerate deterministic Stage 5 platform proofs
        run: |
          python -m tools.run_stage5_proof --output-dir /tmp/featureforge-stage5-proof
          cmp /tmp/featureforge-stage5-proof/platform-proof.json evidence/stage5/platform-proof.json
          cmp /tmp/featureforge-stage5-proof/failure-recovery-proof.json evidence/stage5/failure-recovery-proof.json
      - name: Reproduce Stage 5 benchmark summary from immutable raw trials
        run: |
          python -m tools.summarize_stage5_benchmark --raw evidence/stage5/benchmark-raw.json --output /tmp/featureforge-stage5-benchmark-summary.json
          cmp /tmp/featureforge-stage5-benchmark-summary.json evidence/stage5/benchmark-summary.json
      - name: Regenerate deterministic Stage 6 authority proofs
        run: |
          python -m tools.run_stage6_proof --output-dir /tmp/featureforge-stage6-proof
          cmp /tmp/featureforge-stage6-proof/local-proof.json evidence/stage6/local-proof.json
          cmp /tmp/featureforge-stage6-proof/failure-recovery-proof.json evidence/stage6/failure-recovery-proof.json
      - name: Rebuild deterministic Stage 6 runtime artifacts twice
        run: |
          python -m tools.build_stage6_artifacts --output-dir /tmp/featureforge-stage6-artifacts-a
          python -m tools.build_stage6_artifacts --output-dir /tmp/featureforge-stage6-artifacts-b
          cmp /tmp/featureforge-stage6-artifacts-a/artifact-manifest.json /tmp/featureforge-stage6-artifacts-b/artifact-manifest.json
          cmp /tmp/featureforge-stage6-artifacts-a/featureforge-control-worker.zip /tmp/featureforge-stage6-artifacts-b/featureforge-control-worker.zip
          cmp /tmp/featureforge-stage6-artifacts-a/featureforge-glue-library.zip /tmp/featureforge-stage6-artifacts-b/featureforge-glue-library.zip
