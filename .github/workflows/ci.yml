name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Regenerate deterministic evidence
        run: |
          python -m featureforge.cli simulate --output /tmp/featureforge-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/featureforge-evidence.json').read_text())
          assert evidence['result'] == 'PASS'
          assert evidence['production_claim'] is False
          PY
