name: Stage 6 Authorized Branch Transfer

on:
  push:
    branches: [part3-stage6-aws-plan-qualification]
    paths: [".github/workflows/stage6-authorized-transfer.yml"]

permissions:
  contents: write

concurrency:
  group: featureforge-stage6-authorized-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.actor == 'bhuvaneshwaranmurugan21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
